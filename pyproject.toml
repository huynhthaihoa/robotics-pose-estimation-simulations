[project]
name = "robotics-pose-estimation-simulations"
version = "0.1.0"
description = "A collection of simulations for robotics pose estimation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "manifpy",
]

[tool.uv.sources]
manifpy = { path = "../manif" }
